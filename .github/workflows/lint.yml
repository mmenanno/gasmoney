name: lint

# Reusable workflow. ci.yml invokes this via `uses:` so RuboCop's verdict
# is the gate before tests, image build, or publish run. Not triggered
# on its own — pull_request / push entry points live in ci.yml so we
# don't get duplicate "lint" check runs in the PR UI.
on:
  workflow_call:

jobs:
  rubocop:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop --no-server

  ruby-version-sync:
    name: ruby version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Dockerfile RUBY_VERSION matches .ruby-version
        run: |
          expected="$(tr -d '[:space:]' < .ruby-version)"
          actual="$(grep -oP '^ARG RUBY_VERSION=\K.*' Dockerfile)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Dockerfile RUBY_VERSION ($actual) does not match .ruby-version ($expected)"
            exit 1
          fi
